<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Digital Business Operations Specialist Lab Workbook</title><style>body{margin:0;background:#f4f6fa;color:#182030;font:16px Arial,sans-serif}header{background:#10213d;color:#fff;padding:28px max(5vw,24px)}header b{color:#ffb64d}main{max-width:1050px;margin:auto;padding:28px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}nav button{background:#e3e9f2;color:#10213d}nav button.active,.primary{background:#f79332;color:#10213d}section{background:#fff;border-radius:20px;padding:24px;box-shadow:0 12px 35px #10213d12}label{display:block;font-weight:700;margin:15px 0 6px}textarea,input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd3df;border-radius:9px;font:inherit}textarea{min-height:90px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.score{font-size:28px;font-weight:800;color:#10213d}.hint{color:#667085}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header><b>UPSTRIDE ACADEMY</b><h1>Digital Business Operations Specialist Lab Workbook</h1><p>Complete one cumulative evidence package per module. Use fictional or authorized data only.</p></header><main><nav id="nav"></nav><section><h2 id="heading"></h2><p class="hint">Complete every field. Include at least three semicolon-separated decisions and three tests.</p><div class="grid"><div><label>Objective</label><textarea id="objective"></textarea></div><div><label>Current state</label><textarea id="current"></textarea></div><div><label>Inputs and constraints</label><textarea id="constraints"></textarea></div><div><label>Implementation decisions (separate with ;)</label><textarea id="decisions"></textarea></div><div><label>Risks or exceptions</label><textarea id="risks"></textarea></div><div><label>Tests (separate with ;)</label><textarea id="tests"></textarea></div><div><label>Evidence references (separate with ;)</label><textarea id="evidence"></textarea></div><div><label>Result and limitations</label><textarea id="result"></textarea></div></div><label>Reflection: decision, feedback, and next improvement</label><textarea id="reflection"></textarea><div class="actions"><button class="primary" onclick="grade()">Check my work</button><button onclick="download()">Export submission JSON</button><button onclick="clearModule()">Clear this module</button></div><p id="feedback"></p></section></main><script>const modules=[{"number": 1, "title": "Operating Models, Customer Outcomes, and Professional Responsibility"}, {"number": 2, "title": "Service Discovery and End-to-End Process Mapping"}, {"number": 3, "title": "Roles, Decision Rights, Handoffs, and Capacity"}, {"number": 4, "title": "SOPs, Checklists, Knowledge, and Quality Standards"}, {"number": 5, "title": "Tool Architecture, Data Boundaries, and Integration Decisions"}, {"number": 6, "title": "Work Management, Communication, and Delivery Rhythm"}, {"number": 7, "title": "Service Levels, Exceptions, Risk, and Business Continuity"}, {"number": 8, "title": "Operational Metrics, Root Cause Analysis, and Improvement"}, {"number": 9, "title": "Workplace Simulation: Cross-Team Operations Redesign"}, {"number": 10, "title": "Capstone Operating System, Portfolio, and Hiring Readiness"}],slug="digital-business-operations-specialist",fields=['objective','current','constraints','decisions','risks','tests','evidence','result','reflection'];let current=1,store=JSON.parse(localStorage.getItem(slug)||'{}');const nav=document.getElementById('nav');modules.forEach(m=>{let b=document.createElement('button');b.textContent=m.number;b.title=m.title;b.onclick=()=>show(m.number);nav.appendChild(b)});function save(){let d={};fields.forEach(f=>d[f]=document.getElementById(f).value);store[current]=d;localStorage.setItem(slug,JSON.stringify(store))}fields.forEach(f=>document.getElementById(f).addEventListener('input',save));function show(n){save();current=n;document.getElementById('heading').textContent='Module '+n+' — '+modules[n-1].title;fields.forEach(f=>document.getElementById(f).value=(store[n]||{})[f]||'');[...nav.children].forEach((b,i)=>b.classList.toggle('active',i===n-1));document.getElementById('feedback').textContent=''}function count(v){return v.split(';').filter(x=>x.trim().length>5).length}function score(){save();let d=store[current]||{},s=0,notes=[];if((d.objective||'').length>=30)s+=10;else notes.push('Strengthen the objective.');if((d.current||'').length>=40)s+=5;else notes.push('Add current-state evidence.');if((d.constraints||'').length>=30)s+=5;else notes.push('Add inputs and constraints.');let dc=count(d.decisions||'');s+=Math.min(25,dc*9);if(dc<3)notes.push('Record at least three decisions.');let tc=count(d.tests||'');s+=Math.min(25,tc*9);if(tc<3)notes.push('Add normal, boundary, and failure tests.');let ec=count(d.evidence||'');s+=Math.min(20,ec*7);if(ec<3)notes.push('Reference at least three evidence items.');if((d.reflection||'').length>=80)s+=10;else notes.push('Explain a decision, limitation, and improvement.');document.getElementById('feedback').innerHTML='<span class="score">'+Math.min(100,s)+'/100 provisional</span><br>'+((s>=75?'Ready for submission review. ':'Revise before submitting. ')+notes.join(' '));return Math.min(100,s)}function moduleScore(d){let s=0;if((d.objective||'').length>=30)s+=10;if((d.current||'').length>=40)s+=5;if((d.constraints||'').length>=30)s+=5;s+=Math.min(25,count(d.decisions||'')*9);s+=Math.min(25,count(d.tests||'')*9);s+=Math.min(20,count(d.evidence||'')*7);if((d.reflection||'').length>=80)s+=10;return Math.min(100,s)}function download(){save();let moduleScores=modules.map(m=>({module:m.number,score:moduleScore(store[m.number]||{})})),coursePoints=moduleScores.reduce((a,b)=>a+b.score,0),coursePercent=Math.round(coursePoints/modules.length);let payload={course:slug,learner:'',submittedAt:new Date().toISOString(),modules:store,moduleScores,coursePoints,maximumPoints:modules.length*100,coursePercent,provisionalStatus:coursePercent>=75?'eligible-for-review':'revision-required',integrityDeclaration:'I used fictional or authorized data and removed credentials.'},a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download=slug+'-submission.json';a.click()}function clearModule(){if(confirm('Clear this module?')){fields.forEach(f=>document.getElementById(f).value='');store[current]={};localStorage.setItem(slug,JSON.stringify(store));show(current)}}show(1)</script></body></html>
